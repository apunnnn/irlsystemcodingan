<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRLSubtitle - IRL System</title>
    
    <!-- Load Tailwind CSS & FontAwesome 6 & Socket.IO & SweetAlert -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Google Fonts Lengkap -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600&family=Fira+Code:wght@500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Lobster&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Pacifico&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@400;600;700;800&family=Press+Start+2P&family=Righteous&family=Roboto:wght@400;700&family=Russo+One&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 500: '#6366f1', 600: '#4f46e5' }, 
              dark: { 900: '#09090b', 800: '#18181b', 700: '#27272a' }
            }
          }
        }
      }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; margin: 0; padding: 0; }
        
        .glass-panel {
          background: rgba(24, 24, 27, 0.4);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Styling Slider Input */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #6366f1; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #3f3f46; border-radius: 2px; }
        
        /* Styling Color Picker */
        input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 36px; border-radius: 0.5rem; cursor: pointer; padding: 0; background: none; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #3f3f46; border-radius: 0.5rem; }

        /* Background Preview Kotak-kotak */
        .bg-grid-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* -------------------------------------------------------------
           INTI STYLING TEKS SUBTITLE (BERLAKU DI OBS & PREVIEW)
        ------------------------------------------------------------- */
        /* Styling Toast Alert */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #18181b;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            border-left: 4px solid #10b981;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            font-size: 13px;
        }

        #previewSubtitleBox, #obsSubtitleBox { 
            position: absolute; 
            z-index: 10; 
            transform: translate(-50%, -50%); /* Titik tengah tepat di kursor/persentase */
            width: 90%; 
            display: flex;
            justify-content: center;
        }
        #previewSubtitleBox { cursor: grab; }
        #previewSubtitleBox:active { cursor: grabbing; }
        
        .subtitle-text { 
            text-align: center; 
            padding: 10px 20px; 
            border-radius: 12px; 
            margin: 0 auto;
            width: max-content;
            max-width: 100%;
            word-wrap: break-word;
            line-height: 1.4;
            transition: all 0.1s ease-out;
        }

        /* Mode Cinematic memaksakan background transparan gelap */
        .effect-cinematic {
            background-color: rgba(0, 0, 0, 0.75) !important;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 8px; }
        
        div:where(.swal2-container) div:where(.swal2-popup) {
          background: #18181b !important;
          border: 1px solid rgba(255, 255, 255, 0.05) !important;
          color: #e4e4e7 !important;
          border-radius: 16px !important;
        }
    </style>
</head>
<body class="text-zinc-300 antialiased selection:bg-brand-500 selection:text-white bg-dark-900">

    <!-- Efek Latar Belakang Sama Dengan Main App -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-brand-600/10 blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-emerald-600/10 blur-[120px] pointer-events-none"></div>

    <!-- WAJAH 1: MODE OBS (TRANSPARAN HANYA MUNCUL TEKS) -->
    <div id="obsModeContainer" class="hidden absolute inset-0 w-full h-full pointer-events-none">
        <div id="obsSubtitleBox">
            <div id="obsSubtitleText" class="subtitle-text"></div>
        </div>
    </div>

    <!-- WAJAH 2: MODE CONTROL PANEL (DIBUKA DI CHROME OLEH KLIEN) -->
    <div id="controlModeContainer" class="hidden p-3 w-full max-w-[98%] mx-auto h-screen flex flex-col relative z-10 overflow-hidden box-border">
        <div id="toast-container"></div>

        <!-- HEADER -->
        <div class="mb-2 pb-2 border-b border-zinc-800/80 flex items-center justify-between gap-2 shrink-0">
            <div>
                <h1 class="text-base font-bold text-white flex items-center gap-2 tracking-tight">
                    <i class="fa-solid fa-closed-captioning text-brand-500"></i>
                    IRLSubtitle Control Panel
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="copyObsUrl()" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/40 text-indigo-300 transition-all flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-copy text-indigo-400"></i> Copy OBS URL
                </button>
                <button type="button" onclick="showGuideModal()" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 transition-all flex items-center gap-1 cursor-pointer">
                    <i class="fa-solid fa-circle-question"></i> Petunjuk
                </button>
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold bg-dark-800 border border-zinc-800 text-zinc-400">
                    <i class="fa-solid fa-circle text-[7px] text-emerald-400 animate-pulse"></i> OBS Active
                </span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-3 flex-grow min-h-0 overflow-hidden">
            
            <!-- PANEL KIRI: PENGATURAN KUSTOMISASI & TOMBOL MIC -->
            <div class="lg:col-span-5 flex flex-col h-full min-h-0 overflow-hidden space-y-2">
                
                <!-- TOMBOL START AI MIC -->
                <div class="bg-dark-800/80 rounded-xl p-2.5 border border-indigo-500/20 shadow-md shrink-0">
                    <button id="btnStartAI" onclick="toggleAI()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-3 rounded-lg shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-microphone"></i>
                        <span id="aiBtnText">Mulai Subtitle (Mic)</span>
                    </button>
                    <p id="aiStatusText" class="text-[11px] text-zinc-500 mt-1 text-center truncate">Status: Subtitle nonaktif.</p>
                </div>

                <!-- BOX PENGATURAN DESAIN -->
                <div class="glass-panel rounded-xl p-3 flex-grow min-h-0 overflow-y-auto custom-scrollbar">
                    <div class="space-y-2 text-xs">
                        
                        <!-- Pilihan Bahasa & Font dasar -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 border-b border-zinc-800/80 pb-4 mb-4">
                            <div>
                                <label class="block text-xs font-semibold text-brand-500 mb-1.5 uppercase tracking-wider">Bahasa Subtitle</label>
                                <select id="optLanguage" class="w-full bg-dark-900 border border-zinc-800 text-white text-xs sm:text-sm rounded-xl px-3 py-2.5 outline-none focus:border-brand-500 transition-colors cursor-pointer">
                                    <option value="id-ID" selected>Indonesia</option>
                                    <option value="en-US">English</option>
                                    <option value="jv-ID">Jawa</option>
                                    <option value="su-ID">Sunda</option>
                                    <option value="ko-KR">Korea</option>
                                    <option value="ja-JP">Jepang</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 mb-1.5">Jenis Font</label>
                                <select id="optFont" class="w-full bg-dark-900 border border-zinc-800 text-white text-xs sm:text-sm rounded-xl px-3 py-2.5 outline-none focus:border-brand-500 transition-colors cursor-pointer">
                                    <optgroup label="Standar & Clean">
                                        <option value="Inter">Inter</option>
                                        <option value="Poppins" selected>Poppins</option>
                                        <option value="Montserrat">Montserrat</option>
                                        <option value="Roboto">Roboto</option>
                                    </optgroup>
                                    <optgroup label="Streamer & Display">
                                        <option value="Bebas Neue">Bebas Neue (Bold Tall)</option>
                                        <option value="Oswald">Oswald</option>
                                        <option value="Righteous">Righteous (Modern Tech)</option>
                                        <option value="Russo One">Russo One (Heavy Impact)</option>
                                        <option value="Impact">Impact</option>
                                    </optgroup>
                                    <optgroup label="Coding & Retro Gaming">
                                        <option value="JetBrains Mono">JetBrains Mono</option>
                                        <option value="Fira Code">Fira Code</option>
                                        <option value="Press Start 2P">Press Start 2P (8-Bit Pixel)</option>
                                    </optgroup>
                                    <optgroup label="Handwriting & Fun">
                                        <option value="Caveat">Caveat (Tulisan Tangan)</option>
                                        <option value="Pacifico">Pacifico (Script Fun)</option>
                                        <option value="Lobster">Lobster</option>
                                        <option value="Playfair Display">Playfair Display (Serif)</option>
                                    </optgroup>
                                </select>
                            </div>
                        </div>

                        <!-- Ketebalan & Ukuran Font -->
                        <div class="grid grid-cols-2 gap-3.5">
                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 mb-1.5">Ketebalan Font</label>
                                <select id="optFontStyle" class="w-full bg-dark-900 border border-zinc-800 text-zinc-300 text-xs sm:text-sm rounded-xl px-3 py-2.5 outline-none focus:border-brand-500 transition-colors cursor-pointer">
                                    <option value="normal">Normal</option>
                                    <option value="italic">Miring (Italic)</option>
                                    <option value="bold" selected>Tebal (Bold)</option>
                                    <option value="bold-italic">Tebal Miring</option>
                                </select>
                            </div>
                            <div>
                                <div class="flex justify-between text-xs font-semibold text-zinc-400 mb-1.5">
                                    <label>Ukuran Font (px)</label>
                                    <span id="sizeVal" class="text-brand-500 font-bold">45px</span>
                                </div>
                                <input type="range" id="optSize" min="10" max="150" value="45">
                            </div>
                        </div>

                        <!-- Master Opacity Teks & Latar -->
                        <div class="grid grid-cols-3 gap-3 border-t border-zinc-800/80 pt-3.5 mt-1.5">
                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 mb-1">Warna Teks</label>
                                <input type="color" id="optTextColor" value="#ffffff">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 mb-1">Background</label>
                                <input type="color" id="optBgColor" value="#000000">
                            </div>
                            <div>
                                <div class="flex justify-between text-[11px] font-semibold text-zinc-400 mb-1">
                                    <label>Bg Opacity</label>
                                    <span id="bgOpacityVal" class="text-brand-500 font-bold">0%</span>
                                </div>
                                <input type="range" id="optBgOpacity" min="0" max="100" value="0">
                            </div>
                        </div>

                        <!-- MASTER OPACITY SUBTITLE -->
                        <div class="border-t border-zinc-800/80 pt-3 mt-1.5">
                            <div class="flex justify-between text-xs font-semibold text-brand-500 uppercase tracking-wider mb-1">
                                <label>Master Opacity Subtitle</label>
                                <span id="masterOpacityVal" class="text-brand-500 font-bold">100%</span>
                            </div>
                            <input type="range" id="optMasterOpacity" min="0" max="100" value="100">
                        </div>

                        <!-- EFEK: STROKE (OUTLINE) WITH TOGGLE -->
                        <div class="border-t border-zinc-800/80 pt-3 mt-1.5">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-xs font-semibold text-brand-500 uppercase tracking-wider">Stroke (Outline)</label>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="toggleStroke" class="sr-only peer" checked>
                                    <div class="w-9 h-5 bg-zinc-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-brand-600"></div>
                                </label>
                            </div>
                            <div id="strokeControls" class="grid grid-cols-2 gap-3.5">
                                <div>
                                    <label class="block text-[11px] font-medium text-zinc-400 mb-1">Warna Stroke</label>
                                    <input type="color" id="optStrokeColor" value="#000000">
                                </div>
                                <div>
                                    <div class="flex justify-between text-[11px] font-medium text-zinc-400 mb-1">
                                        <label>Ukuran (px)</label>
                                        <span id="strokeSizeVal" class="text-brand-500 font-semibold">2px</span>
                                    </div>
                                    <input type="range" id="optStrokeSize" min="1" max="20" value="2">
                                </div>
                            </div>
                        </div>

                        <!-- EFEK: SHADOW (BAYANGAN) WITH TOGGLE -->
                        <div class="border-t border-zinc-800/80 pt-3 mt-1.5">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-xs font-semibold text-brand-500 uppercase tracking-wider">Shadow (Bayangan)</label>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="toggleShadow" class="sr-only peer" checked>
                                    <div class="w-9 h-5 bg-zinc-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-brand-600"></div>
                                </label>
                            </div>
                            <div id="shadowControls" class="space-y-2">
                                <div class="grid grid-cols-2 gap-3.5">
                                    <div>
                                        <label class="block text-[11px] font-medium text-zinc-400 mb-1">Warna Shadow</label>
                                        <input type="color" id="optShadowColor" value="#000000">
                                    </div>
                                    <div>
                                        <div class="flex justify-between text-[11px] font-medium text-zinc-400 mb-1">
                                            <label>Opacity Shadow</label>
                                            <span id="shadowOpacityVal" class="text-brand-500 font-semibold">80%</span>
                                        </div>
                                        <input type="range" id="optShadowOpacity" min="0" max="100" value="80">
                                    </div>
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <div class="flex justify-between text-[10px] text-zinc-400 mb-1">
                                            <label>Offset X</label>
                                            <span id="shadowXVal" class="text-brand-500 font-semibold">2px</span>
                                        </div>
                                        <input type="range" id="optShadowX" min="-30" max="30" value="2">
                                    </div>
                                    <div>
                                        <div class="flex justify-between text-[10px] text-zinc-400 mb-1">
                                            <label>Offset Y</label>
                                            <span id="shadowYVal" class="text-brand-500 font-semibold">2px</span>
                                        </div>
                                        <input type="range" id="optShadowY" min="-30" max="30" value="2">
                                    </div>
                                    <div>
                                        <div class="flex justify-between text-[10px] text-zinc-400 mb-1">
                                            <label>Blur</label>
                                            <span id="shadowBlurVal" class="text-brand-500 font-semibold">4px</span>
                                        </div>
                                        <input type="range" id="optShadowBlur" min="0" max="50" value="4">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- EFEK: GLOW (PIJAR / NEON) WITH TOGGLE -->
                        <div class="border-t border-zinc-800/80 pt-3 mt-1.5">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-xs font-semibold text-brand-500 uppercase tracking-wider">Glow (Pijar / Neon)</label>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="toggleGlow" class="sr-only peer">
                                    <div class="w-9 h-5 bg-zinc-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-brand-600"></div>
                                </label>
                            </div>
                            <div id="glowControls" class="grid grid-cols-3 gap-2 opacity-50 pointer-events-none transition-all">
                                <div>
                                    <label class="block text-[11px] font-medium text-zinc-400 mb-1">Warna Glow</label>
                                    <input type="color" id="optGlowColor" value="#6366f1">
                                </div>
                                <div>
                                    <div class="flex justify-between text-[10px] text-zinc-400 mb-1">
                                        <label>Radius (px)</label>
                                        <span id="glowBlurVal" class="text-brand-500 font-semibold">12px</span>
                                    </div>
                                    <input type="range" id="optGlowBlur" min="1" max="50" value="12">
                                </div>
                                <div>
                                    <div class="flex justify-between text-[10px] text-zinc-400 mb-1">
                                        <label>Opacity Glow</label>
                                        <span id="glowOpacityVal" class="text-brand-500 font-semibold">100%</span>
                                    </div>
                                    <input type="range" id="optGlowOpacity" min="0" max="100" value="100">
                                </div>
                            </div>
                        </div>

                        <!-- Posisi (X,Y) & Quick Presets -->
                        <div class="pt-3 border-t border-zinc-800/80 mt-1.5">
                            <label class="block text-xs font-semibold text-zinc-400 mb-2">
                                <i class="fa-solid fa-arrows-up-down-left-right text-brand-500 mr-1"></i> Posisi Subtitle Layar
                            </label>

                            <!-- Quick Position Presets -->
                            <div class="mb-2.5 grid grid-cols-3 gap-1.5 bg-dark-900/80 p-2 rounded-xl border border-zinc-800/80">
                                <button type="button" onclick="setPosPreset(50, 15)" class="py-1.5 px-2 bg-dark-800 hover:bg-brand-600/30 hover:border-brand-500 border border-zinc-700/50 rounded-lg text-xs text-zinc-300 transition-all flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-arrow-up text-[10px]"></i> Atas
                                </button>
                                <button type="button" onclick="setPosPreset(50, 50)" class="py-1.5 px-2 bg-dark-800 hover:bg-brand-600/30 hover:border-brand-500 border border-zinc-700/50 rounded-lg text-xs text-zinc-300 transition-all flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-compress text-[10px]"></i> Tengah
                                </button>
                                <button type="button" onclick="setPosPreset(50, 85)" class="py-1.5 px-2 bg-dark-800 hover:bg-brand-600/30 hover:border-brand-500 border border-zinc-700/50 rounded-lg text-xs text-zinc-300 transition-all flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-arrow-down text-[10px]"></i> Bawah
                                </button>
                                <button type="button" onclick="setPosPreset(15, 85)" class="py-1.5 px-2 bg-dark-800 hover:bg-brand-600/30 hover:border-brand-500 border border-zinc-700/50 rounded-lg text-xs text-zinc-300 transition-all flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-arrow-down-left text-[10px]"></i> Kiri Bawah
                                </button>
                                <button type="button" onclick="setPosPreset(85, 85)" class="py-1.5 px-2 bg-dark-800 hover:bg-brand-600/30 hover:border-brand-500 border border-zinc-700/50 rounded-lg text-xs text-zinc-300 transition-all flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-arrow-down-right text-[10px]"></i> Kanan Bawah
                                </button>
                                <button type="button" onclick="setPosPreset(50, 70)" class="py-1.5 px-2 bg-dark-800 hover:bg-brand-600/30 hover:border-brand-500 border border-zinc-700/50 rounded-lg text-xs text-zinc-300 transition-all flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-film text-[10px]"></i> Lower Third
                                </button>
                            </div>

                            <div class="grid grid-cols-2 gap-3.5">
                                <div>
                                    <div class="flex justify-between text-[11px] font-medium text-zinc-500 mb-1">
                                        <label>Geser Horizontal (X)</label>
                                        <span id="posXVal" class="text-brand-500 font-semibold">50%</span>
                                    </div>
                                    <input type="range" id="optPosX" min="0" max="100" value="50">
                                </div>
                                <div>
                                    <div class="flex justify-between text-[11px] font-medium text-zinc-500 mb-1">
                                        <label>Geser Vertikal (Y)</label>
                                        <span id="posYVal" class="text-brand-500 font-semibold">85%</span>
                                    </div>
                                    <input type="range" id="optPosY" min="0" max="100" value="85">
                                </div>
                            </div>
                        </div>

                        <!-- BATASAN TAMPILAN -->
                        <div class="grid grid-cols-2 gap-2 border-t border-zinc-800/80 pt-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-zinc-400 mb-1">Batas Baris</label>
                                <select id="optLines" class="w-full bg-dark-900 border border-zinc-800 text-zinc-300 text-xs rounded-lg px-2 py-1 outline-none focus:border-brand-500 transition-colors cursor-pointer">
                                    <option value="0">Tanpa Batas</option>
                                    <option value="1">Maksimal 1 Baris</option>
                                    <option value="2" selected>Maksimal 2 Baris</option>
                                    <option value="3">Maksimal 3 Baris</option>
                                </select>
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] font-semibold text-zinc-400 mb-1">
                                    <label>Batas Kata</label>
                                    <span id="wordLimitVal" class="text-brand-500 font-bold">15 Kata</span>
                                </div>
                                <input type="range" id="optWordLimit" min="5" max="50" value="15">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TOMBOL SIMPAN PENGATURAN -->
                <div class="shrink-0 pt-1">
                    <button onclick="saveSubtitleSettings()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-2 rounded-xl shadow-lg shadow-brand-500/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-xs">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Simpan Desain ke OBS
                    </button>
                </div>
            </div>

            <!-- PANEL KANAN: PREVIEW LAYAR REAL-SCALE -->
            <div class="lg:col-span-7 h-full min-h-0 overflow-hidden flex flex-col">
                <div class="glass-panel rounded-xl p-3 border border-zinc-800 h-full flex flex-col min-h-0">
                    <div class="flex flex-row justify-between items-center mb-2 gap-2 shrink-0">
                        <div>
                            <h2 class="text-xs font-bold text-white flex items-center gap-1.5">
                                <i class="fa-solid fa-desktop text-brand-500"></i> Live Canvas Preview
                            </h2>
                        </div>
                        <select id="optOrientation" class="bg-dark-900 border border-zinc-800 text-zinc-300 text-[11px] rounded-lg px-2 py-1 outline-none focus:border-brand-500 cursor-pointer">
                            <option value="portrait" selected>Portrait / TikTok (1080x1920)</option>
                            <option value="landscape">Landscape / YouTube (1920x1080)</option>
                        </select>
                    </div>

                    <!-- Container Wrapper Fleksibel pas dengan Tinggi Layar -->
                    <div id="scaleWrapper" class="flex-grow bg-dark-900 rounded-xl overflow-hidden border border-zinc-800 relative bg-grid-pattern shadow-inner w-full min-h-0">
                        
                        <!-- Video Box -->
                        <div id="videoContainer" class="absolute top-1/2 left-1/2 bg-cover bg-center transition-all duration-300 shadow-2xl border border-zinc-700/50" 
                             style="width: 1080px; height: 1920px; background-color: #18181b; transform: translate(-50%, -50%) scale(0.3);">
                            
                            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <span class="text-indigo-500/20 font-bold text-5xl uppercase tracking-widest border-4 border-indigo-500/10 p-10 rounded-3xl">Area OBS Anda</span>
                            </div>

                            <!-- ELEMEN SUBTITLE PREVIEW -->
                            <div id="previewSubtitleBox">
                                <div id="previewSubtitleText" class="subtitle-text">Selamat datang di IRLSubtitle untuk IRL System. Layar pratinjau ini menampilkan subtitle suara siaran Anda secara langsung.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // INISIALISASI SOCKET.IO KE LOCALHOST 5050
        const socket = io(); // Akan otomatis menembak host port file ini dijalankan

        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'obs'; // default obs
        const streamId = urlParams.get('id') || 'default_user';

        // ELEMEN DOM
        const obsModeContainer = document.getElementById('obsModeContainer');
        const controlModeContainer = document.getElementById('controlModeContainer');
        
        const obsBox = document.getElementById('obsSubtitleBox');
        const obsText = document.getElementById('obsSubtitleText');
        
        const previewBox = document.getElementById('previewSubtitleBox');
        const previewText = document.getElementById('previewSubtitleText');
        
        // INPUTS
        const inputsIds = [
            'optLanguage', 'optFont', 'optFontStyle', 'optSize', 'optTextColor', 'optBgColor', 'optBgOpacity', 'optMasterOpacity',
            'optStrokeColor', 'optStrokeSize',
            'optShadowColor', 'optShadowOpacity', 'optShadowX', 'optShadowY', 'optShadowBlur',
            'optGlowColor', 'optGlowBlur', 'optGlowOpacity',
            'optPosX', 'optPosY', 'optWordLimit', 'optLines'
        ];

        // FUNGSI CUSTOM TOAST
        function showToast(message, isSuccess = true) {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast';
            if (!isSuccess) {
                toast.style.borderLeftColor = '#ef4444'; 
                toast.style.boxShadow = '0 10px 15px -3px rgba(239, 68, 68, 0.2)';
            }
            toast.innerHTML = `<span class="font-bold">${isSuccess ? 'Sukses:' : 'Info:'}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { if (container.contains(toast)) container.removeChild(toast); }, 3000);
        }

        // =========================================================================
        // MODE 1: LOGIKA JIKA HALAMAN DIBUKA DI OBS STUDIO
        // =========================================================================
        if (mode !== 'control') {
            document.body.style.backgroundColor = 'transparent';
            obsModeContainer.classList.remove('hidden');
            
            socket.emit('join_subtitle', streamId);

            socket.on('update_settings', (s) => {
                applyStylesToElement(obsText, obsBox, s);
            });

            socket.on('new_transcription', (data) => {
                let limit = parseInt(data.wordLimit || 100);
                let words = data.text.split(' ');
                if (words.length > limit) {
                    obsText.innerText = words.slice(0, limit).join(' ') + '...';
                } else {
                    obsText.innerText = data.text;
                }
            });

            socket.on('clear_text', () => { obsText.innerText = ''; });
        } 
        
        // =========================================================================
        // MODE 2: LOGIKA JIKA HALAMAN DIBUKA SEBAGAI CONTROL PANEL DI CHROME
        // =========================================================================
        else {
            controlModeContainer.classList.remove('hidden');
            document.title = "IRLSubtitle Control Panel - IRL System";
            
            let liveTranscriptText = '';
            
            socket.emit('join_subtitle', streamId);
            
            // 1. Logika Skala Resolusi Nyata (Tanpa merusak UI)
            function updateCanvasScale() {
                const wrapper = document.getElementById('scaleWrapper');
                const vc = document.getElementById('videoContainer');
                if(!wrapper || !vc) return;

                const isLandscape = document.getElementById('optOrientation').value === 'landscape';
                
                // Set resolusi asli mentah OBS
                const baseWidth = isLandscape ? 1920 : 1080;
                const baseHeight = isLandscape ? 1080 : 1920;
                
                vc.style.width = baseWidth + 'px';
                vc.style.height = baseHeight + 'px';
                
                // Hitung skala agar muat di dalam container Wrapper
                const padding = 20;
                const scaleX = (wrapper.clientWidth - padding) / baseWidth;
                const scaleY = (wrapper.clientHeight - padding) / baseHeight;
                const scale = Math.max(0.1, Math.min(scaleX, scaleY, 1));
                
                // Gunakan absolute centering (translate) dipadukan dengan scale
                vc.style.transform = `translate(-50%, -50%) scale(${scale})`;
            }

            document.getElementById('optOrientation').addEventListener('change', updateCanvasScale);
            window.addEventListener('resize', updateCanvasScale);
            setTimeout(updateCanvasScale, 100); // init

            // Toggle Handlers & UI Enablers
            function bindToggle(toggleId, containerId) {
                const toggle = document.getElementById(toggleId);
                const container = document.getElementById(containerId);
                if (!toggle || !container) return;
                toggle.addEventListener('change', () => {
                    if (toggle.checked) {
                        container.classList.remove('opacity-50', 'pointer-events-none');
                    } else {
                        container.classList.add('opacity-50', 'pointer-events-none');
                    }
                    syncPreview();
                });
            }
            bindToggle('toggleStroke', 'strokeControls');
            bindToggle('toggleShadow', 'shadowControls');
            bindToggle('toggleGlow', 'glowControls');

            // 2. Real-time Preview Updater
            function getSettingsObject() {
                let s = {};
                inputsIds.forEach(id => {
                    let el = document.getElementById(id);
                    if(el) s[id] = el.value;
                });
                s.enableStroke = document.getElementById('toggleStroke')?.checked ?? true;
                s.enableShadow = document.getElementById('toggleShadow')?.checked ?? true;
                s.enableGlow = document.getElementById('toggleGlow')?.checked ?? false;
                return s;
            }

            function syncPreview() {
                const s = getSettingsObject();
                applyStylesToElement(previewText, previewBox, s);
                
                if(document.getElementById('sizeVal')) document.getElementById('sizeVal').innerText = `${s.optSize}px`;
                if(document.getElementById('bgOpacityVal')) document.getElementById('bgOpacityVal').innerText = `${s.optBgOpacity}%`;
                if(document.getElementById('masterOpacityVal')) document.getElementById('masterOpacityVal').innerText = `${s.optMasterOpacity}%`;
                if(document.getElementById('strokeSizeVal')) document.getElementById('strokeSizeVal').innerText = `${s.optStrokeSize}px`;
                if(document.getElementById('shadowOpacityVal')) document.getElementById('shadowOpacityVal').innerText = `${s.optShadowOpacity}%`;
                if(document.getElementById('shadowXVal')) document.getElementById('shadowXVal').innerText = `${s.optShadowX}px`;
                if(document.getElementById('shadowYVal')) document.getElementById('shadowYVal').innerText = `${s.optShadowY}px`;
                if(document.getElementById('shadowBlurVal')) document.getElementById('shadowBlurVal').innerText = `${s.optShadowBlur}px`;
                if(document.getElementById('glowBlurVal')) document.getElementById('glowBlurVal').innerText = `${s.optGlowBlur}px`;
                if(document.getElementById('glowOpacityVal')) document.getElementById('glowOpacityVal').innerText = `${s.optGlowOpacity}%`;
                if(document.getElementById('posXVal')) document.getElementById('posXVal').innerText = `${s.optPosX}%`;
                if(document.getElementById('posYVal')) document.getElementById('posYVal').innerText = `${s.optPosY}%`;
                if(document.getElementById('wordLimitVal')) document.getElementById('wordLimitVal').innerText = `${s.optWordLimit} Kata`;

                const baseText = liveTranscriptText || "Selamat datang di IRLSubtitle untuk IRL System. Layar pratinjau ini menampilkan subtitle suara siaran Anda secara langsung.";
                let words = baseText.split(' ');
                let limit = parseInt(s.optWordLimit);
                previewText.innerText = words.length > limit ? words.slice(0, limit).join(' ') + '...' : baseText;
            }

            inputsIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', syncPreview);
                    if(el.tagName === 'SELECT') el.addEventListener('change', syncPreview);
                }
            });

            // 3. Logika Drag and Drop di kanvas skala asli
            let isDragging = false;
            function startDrag(e) { isDragging = true; if(e.type === 'touchstart') e.preventDefault(); }
            function doDrag(e) {
                if (!isDragging) return;
                let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                const vc = document.getElementById('videoContainer');
                const rect = vc.getBoundingClientRect(); // Mengembalikan ukuran scaled, sempurna untuk persentase
                
                let xPerc = ((clientX - rect.left) / rect.width) * 100;
                let yPerc = ((clientY - rect.top) / rect.height) * 100;
                
                document.getElementById('optPosX').value = Math.round(Math.max(0, Math.min(100, xPerc)));
                document.getElementById('optPosY').value = Math.round(Math.max(0, Math.min(100, yPerc)));
                syncPreview();
            }
            function stopDrag() { isDragging = false; }

            previewBox.addEventListener('mousedown', startDrag);
            previewBox.addEventListener('touchstart', startDrag, { passive: false });
            window.addEventListener('mousemove', doDrag);
            window.addEventListener('touchmove', doDrag, { passive: false });
            window.addEventListener('mouseup', stopDrag);
            window.addEventListener('touchend', stopDrag);

            // Quick Position Preset Handler
            window.setPosPreset = function(x, y) {
                const elX = document.getElementById('optPosX');
                const elY = document.getElementById('optPosY');
                if (elX) elX.value = x;
                if (elY) elY.value = y;
                syncPreview();
            };

            // Copy OBS URL Function
            window.copyObsUrl = function() {
                const obsUrl = `http://localhost:5050/subtitle.html?mode=obs&id=${streamId}`;
                navigator.clipboard.writeText(obsUrl).then(() => {
                    showToast('URL Subtitle OBS berhasil disalin!');
                }).catch(() => {
                    showToast('Gagal menyalin URL.', false);
                });
            };

            // Petunjuk Penggunaan Modal
            window.showGuideModal = function() {
                const obsUrl = `http://localhost:5050/subtitle.html?mode=obs&id=${streamId}`;
                Swal.fire({
                    title: 'Petunjuk Penggunaan IRLSubtitle',
                    html: `
                        <div class="text-left text-xs space-y-3 font-sans text-zinc-300">
                            <p class="text-zinc-400">Ikuti langkah mudah berikut untuk mengintegrasikan subtitle ke OBS Studio:</p>
                            <div class="bg-dark-900 p-3 rounded-xl border border-zinc-800 space-y-1">
                                <span class="font-semibold text-brand-400">1. Salin URL OBS Subtitle:</span>
                                <input type="text" readonly value="${obsUrl}" onclick="this.select()" class="w-full bg-dark-800 border border-zinc-700 text-white font-mono text-[11px] p-2 rounded cursor-pointer">
                            </div>
                            <div class="space-y-1">
                                <p><strong class="text-white">2. Buka OBS Studio:</strong> Tambahkan Source <code class="bg-zinc-800 px-1 py-0.5 rounded text-brand-400">Browser</code> baru.</p>
                                <p><strong class="text-white">3. Tempel URL:</strong> Masukkan URL yang telah disalin di atas ke bidang URL Browser Source OBS.</p>
                                <p><strong class="text-white">4. Atur Resolusi OBS:</strong> Set Width: <code class="text-emerald-400">1080</code> & Height: <code class="text-emerald-400">1920</code> (atau 1920x1080).</p>
                                <p><strong class="text-white">5. Jalankan Subtitle:</strong> Klik tombol <span class="text-emerald-400 font-semibold">"Mulai Subtitle (Mic)"</span> lalu klik <span class="text-indigo-400 font-semibold">"Simpan Desain ke OBS"</span>.</p>
                            </div>
                        </div>
                    `,
                    icon: 'info',
                    confirmButtonText: 'Saya Mengerti',
                    confirmButtonColor: '#4f46e5'
                });
            };

            syncPreview(); // Call awal

            // 4. Save Settings via Socket
            window.saveSubtitleSettings = function() {
                const s = getSettingsObject();
                socket.emit('save_settings', { streamId: streamId, settings: s });
                showToast('Desain Subtitle berhasil disimpan & dikirim ke OBS!');
            }

            // 5. SISTEM MIC LOKAL TERTANAM (WEB SPEECH API)
            let recognition;
            let isListening = false;
            const btnAI = document.getElementById('btnStartAI');
            const statusAI = document.getElementById('aiStatusText');
            const btnText = document.getElementById('aiBtnText');

            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (window.SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                        else interimTranscript += event.results[i][0].transcript;
                    }
                    const textToSend = interimTranscript || finalTranscript;
                    if (textToSend.trim() !== '') {
                        liveTranscriptText = textToSend;
                        syncPreview();
                        statusAI.innerHTML = `Mendengar: <span class="text-emerald-400">"${textToSend.substring(0, 30)}..."</span>`;
                        socket.emit('send_transcription', { 
                            streamId: streamId, 
                            text: textToSend, 
                            isFinal: event.results[event.resultIndex].isFinal,
                            wordLimit: document.getElementById('optWordLimit').value
                        });
                    }
                };

                recognition.onerror = (event) => {
                    console.error("Mic Error:", event.error);
                    if(event.error === 'not-allowed') {
                        Swal.fire({
                            title: 'Mikrofon Diblokir!',
                            text: 'Chrome memblokir akses mikrofon. Silakan klik ikon Kamera/Gembok di URL Bar Chrome Anda, lalu izinkan mikrofon.',
                            icon: 'error',
                            background: '#18181b', color: '#fff'
                        });
                        stopAIEngine();
                    }
                };

                recognition.onend = () => {
                    if (isListening) recognition.start(); // Auto restart
                };
            } else {
                btnAI.disabled = true;
                btnText.innerText = "Browser Tidak Mendukung";
                statusAI.innerText = "Fitur AI membutuhkan Google Chrome terbaru.";
            }

            window.toggleAI = function() {
                if (!isListening) {
                    recognition.lang = document.getElementById('optLanguage').value || 'id-ID';
                    try { recognition.start(); } catch(e) {}
                    
                    isListening = true;
                    btnAI.classList.replace('bg-emerald-600', 'bg-rose-600');
                    btnAI.classList.replace('hover:bg-emerald-500', 'hover:bg-rose-500');
                    btnAI.classList.replace('shadow-[0_0_20px_rgba(16,185,129,0.2)]', 'shadow-[0_0_20px_rgba(225,29,72,0.2)]');
                    btnText.innerText = "Hentikan Subtitle";
                    statusAI.innerHTML = `<span class="text-emerald-400 font-bold animate-pulse">Sistem Subtitle Aktif & Mendengarkan...</span>`;
                } else {
                    stopAIEngine();
                }
            }

            function stopAIEngine() {
                isListening = false;
                liveTranscriptText = '';
                try { recognition.stop(); } catch(e) {}
                
                btnAI.classList.replace('bg-rose-600', 'bg-emerald-600');
                btnAI.classList.replace('hover:bg-rose-500', 'hover:bg-emerald-500');
                btnAI.classList.replace('shadow-[0_0_20px_rgba(225,29,72,0.2)]', 'shadow-[0_0_20px_rgba(16,185,129,0.2)]');
                btnText.innerText = "Mulai Subtitle (Mic)";
                statusAI.innerText = "Status: Subtitle nonaktif.";
                
                syncPreview();
                socket.emit('clear_transcription', streamId);
            }
        }

        // =========================================================================
        // FUNGSI GLOBAL PEMASANG DESAIN (Dipakai Preview & OBS)
        // =========================================================================
        function hexToRgba(hex, opacity) {
            let c;
            if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
                c= hex.substring(1).split('');
                if(c.length== 3) c= [c[0], c[0], c[1], c[1], c[2], c[2]];
                c= '0x'+c.join('');
                return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+(opacity/100)+')';
            }
            return hex;
        }

        function applyStylesToElement(textEl, boxEl, s) {
            if(!textEl || !boxEl || !s) return;
            textEl.style.fontFamily = `'${s.optFont}', sans-serif`;
            textEl.style.fontStyle = (s.optFontStyle || '').includes('italic') ? 'italic' : 'normal';
            textEl.style.fontWeight = (s.optFontStyle || '').includes('bold') ? 'bold' : 'normal';
            textEl.style.fontSize = `${s.optSize}px`;
            textEl.style.color = s.optTextColor;
            textEl.className = 'subtitle-text';
            
            // Master Opacity
            const masterOpacity = (s.optMasterOpacity !== undefined ? parseInt(s.optMasterOpacity) : 100) / 100;
            textEl.style.opacity = masterOpacity;

            // Stroke (Outline ke Luar via Drop-Shadow Grid)
            const enableStroke = s.enableStroke !== undefined ? (s.enableStroke === true || s.enableStroke === 'true') : true;
            const strokeSize = parseInt(s.optStrokeSize || 0);
            const strokeColor = s.optStrokeColor || '#000000';
            textEl.style.webkitTextStroke = '0px transparent'; // Matikan inner/center stroke standar browser

            // Shadow & Glow & Outer Stroke
            const shadows = [];

            if (enableStroke && strokeSize > 0) {
                const sC = strokeColor;
                // Buat 8-directional crisp outer stroke
                shadows.push(`-${strokeSize}px -${strokeSize}px 0 ${sC}`);
                shadows.push(`${strokeSize}px -${strokeSize}px 0 ${sC}`);
                shadows.push(`-${strokeSize}px ${strokeSize}px 0 ${sC}`);
                shadows.push(`${strokeSize}px ${strokeSize}px 0 ${sC}`);
                shadows.push(`0 -${strokeSize}px 0 ${sC}`);
                shadows.push(`0 ${strokeSize}px 0 ${sC}`);
                shadows.push(`-${strokeSize}px 0 0 ${sC}`);
                shadows.push(`${strokeSize}px 0 0 ${sC}`);
            }
            
            // Shadow kustom
            const enableShadow = s.enableShadow !== undefined ? (s.enableShadow === true || s.enableShadow === 'true') : true;
            const shadowBlur = parseInt(s.optShadowBlur || 0);
            const shadowX = parseInt(s.optShadowX || 0);
            const shadowY = parseInt(s.optShadowY || 0);
            const shadowOpacity = parseInt(s.optShadowOpacity !== undefined ? s.optShadowOpacity : 80);
            if (enableShadow && shadowOpacity > 0 && (shadowBlur > 0 || shadowX !== 0 || shadowY !== 0)) {
                shadows.push(`${shadowX}px ${shadowY}px ${shadowBlur}px ${hexToRgba(s.optShadowColor || '#000000', shadowOpacity)}`);
            }

            // Glow kustom
            const enableGlow = s.enableGlow !== undefined ? (s.enableGlow === true || s.enableGlow === 'true') : false;
            const glowBlur = parseInt(s.optGlowBlur || 0);
            const glowOpacity = parseInt(s.optGlowOpacity !== undefined ? s.optGlowOpacity : 100);
            if (enableGlow && glowBlur > 0 && glowOpacity > 0) {
                const glowRgba = hexToRgba(s.optGlowColor || '#6366f1', glowOpacity);
                shadows.push(`0 0 ${glowBlur}px ${glowRgba}`);
                shadows.push(`0 0 ${glowBlur * 2}px ${glowRgba}`);
            }

            textEl.style.textShadow = shadows.length > 0 ? shadows.join(', ') : 'none';
            textEl.style.backgroundColor = hexToRgba(s.optBgColor || '#000000', s.optBgOpacity !== undefined ? s.optBgOpacity : 0);

            boxEl.style.left = `${s.optPosX}%`;
            boxEl.style.top = `${s.optPosY}%`;

            const lines = parseInt(s.optLines);
            textEl.style.display = lines > 0 ? '-webkit-box' : 'block';
            textEl.style.webkitLineClamp = lines > 0 ? lines : 'unset';
            textEl.style.webkitBoxOrient = 'vertical';
            textEl.style.overflow = lines > 0 ? 'hidden' : 'visible';
            textEl.style.whiteSpace = lines > 0 ? 'normal' : 'pre-wrap';
        }
    </script>
</body>
</html>
